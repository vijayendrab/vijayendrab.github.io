<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        h1 { color: #333; }
        .status { margin-bottom: 20px; font-size: 1.5rem; font-weight: bold; color: #555; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; }
        .cell { width: 100px; height: 100px; background: white; border: 2px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .cell:hover { background: #f9f9f9; }
        .cell.taken { cursor: not-allowed; }
        .reset-btn { margin-top: 30px; padding: 10px 20px; font-size: 1rem; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
        .reset-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

  <h1>Tic-Tac-Toe</h1>
  <div class="status" id="status">Player X's Turn</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button class="reset-btn" onclick="resetGame()">Restart Game</button>

  <script>
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    let currentPlayer = 'X';
    let gameState = ["", "", "", "", "", "", "", "", ""];
    let gameActive = true;

    const winningConditions = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Cols
        [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    function handleCellClick(e) {
        const clickedCell = e.target;
        const clickedIndex = parseInt(clickedCell.getAttribute('data-index'));

        if (gameState[clickedIndex] !== "" || !gameActive) return;

        gameState[clickedIndex] = currentPlayer;
        clickedCell.innerText = currentPlayer;
        clickedCell.classList.add('taken');

        checkResult();
    }

    function checkResult() {
        let roundWon = false;
        for (let condition of winningConditions) {
            let a = gameState[condition[0]];
            let b = gameState[condition[1]];
            let c = gameState[condition[2]];
            if (a === '' || b === '' || c === '') continue;
            if (a === b && b === c) {
                roundWon = true;
                break;
            }
        }

        if (roundWon) {
            statusElement.innerText = `Player ${currentPlayer} Wins! 🎉`;
            gameActive = false;
            return;
        }

        if (!gameState.includes("")) {
            statusElement.innerText = "It's a Draw! 🤝";
            gameActive = false;
            return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusElement.innerText = `Player ${currentPlayer}'s Turn`;
    }

    function resetGame() {
        currentPlayer = 'X';
        gameState = ["", "", "", "", "", "", "", "", ""];
        gameActive = true;
        statusElement.innerText = "Player X's Turn";
        document.querySelectorAll('.cell').forEach(cell => {
            cell.innerText = "";
            cell.classList.remove('taken');
        });
    }

    boardElement.addEventListener('click', handleCellClick);
  </script>
</body>
</html>
